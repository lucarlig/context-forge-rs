[package]
name = "context-forge-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/lucarlig/context-forge-rs"
default-run = "context-forge-rs"

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
async-compression = { version = "0.4.54", default-features = false, features = ["tokio", "brotli", "deflate", "gzip", "zlib", "zstd"] }
aws-credential-types = "1.2.14"
aws-sigv4 = "1.4.5"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.23"
cel = "0.16.1"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8.44"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
futures-util = "0.3"
hmac = "0.13"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.13", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
ipnet = "2.12"
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonschema = { version = "0.63", default-features = false }
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
mime_guess = "2"
minijinja = { version = "2.24", default-features = false, features = ["builtins", "fuel", "serde"] }
p256 = "0.14"
p384 = "0.14"
p521 = "0.14"
percent-encoding = "2"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
redis = { version = "1.8.3", default-features = false, features = ["tokio-rustls-comp"] }
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
rmcp = { version = "3.12", default-features = false, features = ["server", "transport-streamable-http-server"] }
rsa = { version = "0.10", default-features = false, features = ["encoding"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7.2"
sha2 = "0.11"
shell-words = "1.1"
sqlx = { version = "0.9.1", default-features = false, features = ["derive", "postgres", "runtime-tokio", "sqlite-bundled", "tls-rustls-ring-native-roots"] }
sqlx-postgres = { version = "0.9.1", default-features = false, features = ["json"] }
sqlx-sqlite = { version = "0.9.1", default-features = false, features = ["json"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
tonic-reflection = { version = "0.14.9", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
tokio-tungstenite = "0.29"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

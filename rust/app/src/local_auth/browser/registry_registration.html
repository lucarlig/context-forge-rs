{% if result.success %}
<button type="button" disabled title="{{ result.message }}">{{ "OAuth Config Required" if result.oauth_required else "Registered Successfully" }}</button>
{% else %}
<button type="button" hx-post="{{ action }}" hx-target="this" hx-swap="outerHTML" title="{{ result.error or result.message }}">Retry registration</button>
{% endif %}

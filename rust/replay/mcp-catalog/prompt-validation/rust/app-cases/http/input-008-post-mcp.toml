[request]
method = "POST"
path = "/mcp/"
body = '''{"jsonrpc": "2.0", "id": 0, "method": "prompts/get", "params": {"name": "escape", "arguments": {"who": "<>/&\"'"}, "_meta": {"io.modelcontextprotocol/protocolVersion": "2026-07-28", "io.modelcontextprotocol/clientCapabilities": {}}}}'''

[request.headers]
Accept = "application/json"
Content-Type = "application/json"
MCP-Method = "prompts/get"
MCP-Name = "escape"
MCP-Protocol-Version = "2026-07-28"

[response]
status = 200

[response.headers]
content-type = "application/json"
vary = "Origin"
x-contextforge-mcp-runtime = "[..]"

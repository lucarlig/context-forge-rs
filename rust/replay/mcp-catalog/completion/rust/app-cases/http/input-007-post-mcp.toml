[request]
method = "POST"
path = "/mcp/"
body = '{"jsonrpc": "2.0", "id": 8, "method": "completion/complete", "params": {"ref": {"type": "ref/prompt", "name": "fixture-welcome"}, "argument": {"name": "name", "value": ""}, "context": {"arguments": {"before": 1}}}}'

[request.headers]
Accept = "application/json"

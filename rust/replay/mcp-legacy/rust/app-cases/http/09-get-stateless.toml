[request]
method = "GET"
path = "/mcp/"

[request.headers]
Accept = "application/json, text/event-stream"
Content-Type = "application/json"
MCP-Protocol-Version = "2025-11-25"

[response]
status = 405

[response.headers]
allow = "POST, DELETE"
content-type = "application/json"
vary = "Origin"
x-contextforge-mcp-runtime = "python"

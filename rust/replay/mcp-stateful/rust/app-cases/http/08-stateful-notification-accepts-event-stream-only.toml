[request]
method = "POST"
path = "/mcp/"
body = '{"jsonrpc":"2.0","method":"notifications/initialized"}'

[request.headers]
Accept = "text/event-stream"
Content-Type = "application/json"

[response]
status = 406

[response.headers]
content-type = "application/json"
mcp-session-id = "[..]"
vary = "Origin"
x-contextforge-mcp-runtime = "[..]"
